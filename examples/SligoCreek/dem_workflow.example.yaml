root: .
site:
  name: SligoCreekDemo
  target_crs: EPSG:26918
spatial_input:
  mode: outlet
outlet:
  # Sligo Creek/ Northwest Branch confluence candidate supplied in SC.kmz.
  # Keep this point on Sligo Creek; moving it downstream would delineate part
  # of the larger Anacostia system instead of the Sligo Creek watershed.
  longitude: -76.9744266065
  latitude: 38.9571888036
  input_crs: EPSG:4326
  raw_path: inputs/outlet_raw.geojson
  snap_to_flowline: true
  snap_distance_m: 50
  snapped_path: inputs/outlet_snapped.geojson
dem_acquisition:
  # Base DEM acquisition on the estimated Sligo Creek KMZ boundary, then pad it
  # because the KMZ is an operator-digitized estimate rather than a surveyed line.
  method: documented_watershed
  acquisition_area: intermediate/dem_acquisition_area.geojson
  source: Estimated Sligo Creek.kmz
  uncertainty_margin_km: 2
  tile_index: indexes/usgs_3dep_tiles.demo.geojson
  tile_manifest: intermediate/dem_download_manifest.json
  flowline_path: hydro/NHDFlowline.demo.geojson
  envelope_type: oriented_rectangle
  upstream_trace_distance_km: 20
  upstream_margin_km: 1
  downstream_margin_km: 1
  lateral_margin_km: 1
  auto_expand: true
  directional_expansion: true
  boundary_safety_distance_m: 500
  expanded_acquisition_area: intermediate/dem_acquisition_area_attempt2.geojson
  expansion_distance_km: 5
  summary: intermediate/dem_workflow_summary.json
  watershed_boundary: intermediate/watershed_boundary.geojson
  validation_summary: intermediate/dem_boundary_validation_summary.json
  allow_acquisition_area_watershed_fallback: true

documented_watershed:
  source: Estimated Sligo Creek.kmz
  title: Estimated Sligo Creek review outline
  organization: Operator digitized Google Earth review
  url: examples/SligoCreek/Estimated Sligo Creek.kmz
  license: project review artifact; verify before design use
