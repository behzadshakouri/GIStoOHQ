root: .
site:
  name: JohnMcCormack3600
  target_crs: EPSG:26918
project:
  title: 3600 John McCormack Rd NE Plan Set 20240709
  jurisdiction: Washington, DC
  source_date: 2024-07-09
spatial_input:
  mode: outlet
outlet:
  # Local drainage/outlet candidate supplied in JM.kmz. This is appropriate
  # for screening the street-scale study area, but must be reconciled with the
  # plan-set drainage structures or a field survey before final design.
  longitude: -76.99597205373109
  latitude: 38.93589535566567
  input_crs: EPSG:4326
  raw_path: inputs/outlet_raw.geojson
  snap_to_flowline: false
dem_acquisition:
  method: outlet_buffer
  acquisition_area: intermediate/dem_acquisition_area.geojson
  # A 200 m half-width gives a focused 400 m x 400 m street/near-area window.
  upstream_km: 0.2
  downstream_km: 0.2
  lateral_km: 0.2
  auto_expand: true
  directional_expansion: true
  boundary_safety_distance_m: 50
  expanded_acquisition_area: intermediate/dem_acquisition_area_attempt2.geojson
  expansion_distance_km: 0.1
  summary: intermediate/dem_workflow_summary.json
  watershed_boundary: intermediate/watershed_boundary.geojson
  validation_summary: intermediate/dem_boundary_validation_summary.json
paths:
  raw_dem_dir: dem/raw
download_dir: source_downloads
